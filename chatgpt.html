        // --- HIỆU ỨNG MẠNG LƯỚI ĐỘNG (PARTICLE NETWORK) ---
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        
        const connectDistance = 150; 
        const mouseConnectDistance = 180; 
        
        let mouse = { x: null, y: null }
        
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 12000;
            if (numberOfParticles > 80) numberOfParticles = 80; 
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = Math.random() * 2 + 1;
                let x = Math.random() * (canvas.width - size * 2) + size * 2;
                let y = Math.random() * (canvas.height - size * 2) + size * 2;
                let directionX = (Math.random() - 0.5) * 1.5;
                let directionY = (Math.random() - 0.5) * 1.5;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }
        
        class Particle {
            constructor(x, y, directionX, directionY, size) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = isDark ? 'rgba(96, 165, 250, 0.6)' : 'rgba(30, 64, 175, 0.4)'; 
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX; this.y += this.directionY;
                this.draw();
            }
        }
        
        function animateNetwork() {
            requestAnimationFrame(animateNetwork);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); }
            connect();
        }
        
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (connectDistance * connectDistance)) {
                        opacityValue = 1 - (distance / (connectDistance * connectDistance));
                        ctx.strokeStyle = isDark ? `rgba(96, 165, 250, ${opacityValue * 0.4})` : `rgba(30, 64, 175, ${opacityValue * 0.3})`;
                        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
                if (mouse.x != null) {
                    let distanceToMouse = ((particlesArray[a].x - mouse.x) * (particlesArray[a].x - mouse.x)) + 
                                          ((particlesArray[a].y - mouse.y) * (particlesArray[a].y - mouse.y));
                    if (distanceToMouse < (mouseConnectDistance * mouseConnectDistance)) {
                        opacityValue = 1 - (distanceToMouse / (mouseConnectDistance * mouseConnectDistance));
                        ctx.strokeStyle = isDark ? `rgba(147, 197, 253, ${opacityValue * 0.7})` : `rgba(30, 58, 138, ${opacityValue * 0.5})`;
                        ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                    }
                }
            }
        }
        
        window.addEventListener('resize', initCanvas);
        initCanvas(); animateNetwork();
    </script>
