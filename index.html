<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legit Shop - Dịch Vụ Số Đỉnh Cao</title>
    <link rel="icon" href="legit.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        /* Prevent SVG text selection issues */
        svg text { pointer-events: none; }
    </style>
</head>
<body class="transition-colors duration-300 overflow-x-hidden">
    
    <!-- Nền mạng động (Dynamic Network Background) -->
    <div id="bg-container" class="fixed inset-0 z-[-1] bg-slate-50 dark:bg-gradient-to-br dark:from-blue-950 dark:via-blue-900 dark:to-indigo-950 transition-colors duration-700">
        <canvas id="network-canvas" class="w-full h-full"></canvas>
    </div>

    <!-- Màn hình chờ (Preloader) Tối giản & Tinh tế -->
    <div id="preloader" class="fixed inset-0 z-[9999] bg-white dark:bg-blue-950 flex flex-col items-center justify-center transition-opacity duration-700 ease-in-out pointer-events-auto">
        <div class="relative flex items-center justify-center w-28 h-28 mb-6">
            <div class="absolute inset-0 rounded-full border-4 border-slate-100 dark:border-blue-900/50"></div>
            <div class="absolute inset-0 rounded-full border-4 border-blue-600 dark:border-blue-400 border-t-transparent animate-spin"></div>
            <img src="legit.png" alt="Legit Shop" class="w-16 h-16 object-cover z-10 rounded-xl" onerror="this.onerror=null; this.outerHTML='<svg class=\\\'w-12 h-12 text-blue-600 dark:text-blue-400 z-10\\\' fill=\\\'none\\\' stroke=\\\'currentColor\\\' viewBox=\\\'0 0 24 24\\\'><path stroke-linecap=\\\'round\\\' stroke-linejoin=\\\'round\\\' stroke-width=\\\'2\\\' d=\\\'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z\\\'></path></svg>'" />
        </div>
        <h2 class="text-slate-800 dark:text-white font-bold text-xl tracking-[0.15em] uppercase mb-2">Legit Shop</h2>
        <p class="text-blue-600 dark:text-blue-400 text-sm font-medium animate-pulse">Đang tải dữ liệu...</p>
    </div>

    <!-- Ứng dụng sẽ được render vào đây -->
    <div id="root"></div>

    <script>
        // --- XỬ LÝ PRELOADER ---
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('opacity-0');
                preloader.classList.remove('pointer-events-auto');
                preloader.classList.add('pointer-events-none');
                setTimeout(() => { preloader.style.display = 'none'; }, 700);
            }, 500); 
        });

        // --- DATA & TRANSLATIONS ---
        const translations = {
            vi: {
                lang: "VI",
                flag: "🇻🇳",
                heroTitle: "Dịch Vụ Số Đỉnh Cao",
                heroSub: "Nâng tầm trải nghiệm của bạn với các tài khoản và phần mềm bản quyền chất lượng hàng đầu.",
                tool2fa: "Công Cụ 2FA",
                zaloGroup: "Cộng Đồng Zalo",
                zaloContact: "Liên Hệ Zalo",
                fbContact: "Facebook",
                productsTitle: "Khám Phá Sản Phẩm",
                buyNow: "Xem Chi Tiết",
                priceFrom: "Chỉ từ 70.000đ",
                unavailable: "Sản phẩm này tạm thời dừng cung cấp",
                backHome: "Quay lại trang chủ",
                footerDesc: "Legit Shop - Nơi cung cấp giải pháp số đáng tin cậy và uy tín nhất của bạn.",
                contact: "Thông Tin Liên Hệ",
                phone: "0816 522 665 (Đức Dũng)",
                email: "zun.is.michael@gmail.com",
                rights: "Bản quyền thuộc về Legit Shop.",
                products: {
                    chatgpt: "Trợ lý AI mạnh mẽ nhất giúp bạn giải quyết mọi công việc.",
                    gemini: "AI đa phương thức từ Google, sáng tạo không giới hạn.",
                    supergrok: "Grok phiên bản nâng cấp, phân tích dữ liệu thời gian thực.",
                    capcut: "Công cụ biên tập video chuyên nghiệp và dễ sử dụng.",
                    antigravity: "Công cụ hỗ trợ hiệu suất làm việc vượt trội.",
                    veo3: "Trình tạo video AI thế hệ mới, mượt mà và sắc nét.",
                    office365: "Bộ công cụ văn phòng tiêu chuẩn từ Microsoft.",
                    canva: "Nền tảng thiết kế đồ họa dành cho tất cả mọi người.",
                    youtube: "Nâng cấp chính chủ trên tài khoản của bạn. Nghe nhạc và xem video không quảng cáo."
                },
                priceOverrides: {
                    gemini: "Chỉ từ 60.000đ",
                    supergrok: "Chỉ từ 330.000đ",
                    capcut: "Chỉ từ 50.000đ",
                    antigravity: "Chỉ từ 60.000đ",
                    veo3: "Chỉ từ 350.000đ",
                    office365: "400.000đ / Năm",
                    canva: "Chỉ từ 60.000đ",
                    youtube: "720.000đ / Năm"
                }
            },
            en: {
                lang: "EN",
                flag: "🇬🇧",
                heroTitle: "Premium Digital Services",
                heroSub: "Elevate your experience with top-quality premium accounts and software.",
                tool2fa: "2FA Tool",
                zaloGroup: "Zalo Community",
                zaloContact: "Contact Zalo",
                fbContact: "Facebook",
                productsTitle: "Explore Products",
                buyNow: "View Details",
                priceFrom: "From 70,000 VND",
                unavailable: "This product is temporarily unavailable",
                backHome: "Back to Home",
                footerDesc: "Legit Shop - Your most reliable and trusted digital solutions provider.",
                contact: "Contact Info",
                phone: "0816 522 665 (Duc Dung)",
                email: "zun.is.michael@gmail.com",
                rights: "All rights reserved by Legit Shop.",
                products: {
                    chatgpt: "The most powerful AI assistant to help you solve any task.",
                    gemini: "Multimodal AI from Google, limitless creativity.",
                    supergrok: "Upgraded Grok, real-time data analysis.",
                    capcut: "Professional and easy-to-use video editing tool.",
                    antigravity: "Ultimate productivity enhancement tool.",
                    veo3: "Next-gen AI video generator, smooth and crisp.",
                    office365: "Standard office suite from Microsoft.",
                    canva: "Graphic design platform for everyone.",
                    youtube: "Official upgrade on your personal account. Enjoy ad-free video and music."
                },
                priceOverrides: {
                    gemini: "From 60,000 VND",
                    supergrok: "From 330,000 VND",
                    capcut: "From 50,000 VND",
                    antigravity: "From 60,000 VND",
                    veo3: "From 350,000 VND",
                    office365: "400,000 VND / Year",
                    canva: "From 60,000 VND",
                    youtube: "720,000 VND / Year"
                }
            }
        };

        const zaloSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /><text x="12" y="13" text-anchor="middle" font-size="6" font-weight="bold" fill="currentColor" stroke="none">Zalo</text></svg>`;

        // --- STATE ---
        let lang = 'vi';
        let isDark = false;
        let isMenuOpen = false;
        let unavailableProduct = null;

        // --- ACTIONS ---
        function toggleLang() {
            lang = lang === 'vi' ? 'en' : 'vi';
            render();
        }

        function toggleTheme() {
            isDark = !isDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            render();
        }

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            render();
        }

        function handleProductClick(event, link, index) {
            if (!link || link === '#') {
                event.preventDefault();
                unavailableProduct = getProducts()[index];
                render();
            }
        }

        function goHome() {
            unavailableProduct = null;
            render();
        }

        // Fetch products dynamically based on language
        function getProducts() {
            const t = translations[lang];
            return [
                { name: "ChatGPT", image: "https://www.shutterstock.com/image-illustration/valencia-spain-may-2023-chatgpt-600nw-2303671357.jpg", desc: t.products.chatgpt, link: "chatgpt.html" },
                { name: "Gemini Pro", image: "https://reindeersoft.com/_next/image?url=https%3A%2F%2Freindeersoft.com%2Fapi%2Fuploads%2FReindeerSoft-1744821579830.webp&w=828&q=75", desc: t.products.gemini, link: "geminipro.html", priceOverride: t.priceOverrides.gemini },
                { name: "SuperGrok", image: "https://taikhoangiare.net/wp-content/uploads/2025/04/grok3.jpg", desc: t.products.supergrok, link: "supergrok.html", priceOverride: t.priceOverrides.supergrok },
                { name: "CapCut Pro", image: "https://cdn2.fptshop.com.vn/unsafe/Uploads/images/tin-tuc/177552/Originals/5-cach-luu-video-capcut-khong-co-logo-don-gian-nhanh-chong-ban-nen-bo-tui-ngay-trong-nam-20241.jpg", desc: t.products.capcut, link: "capcut.html", priceOverride: t.priceOverrides.capcut },
                { name: "Antigravity", image: "https://cdn2.fptshop.com.vn/unsafe/800x0/google_antigravity_la_gi_5_080c07ecbc.jpg", desc: t.products.antigravity, link: "antigravity.html", priceOverride: t.priceOverrides.antigravity },
                { name: "Veo3", image: "https://cdn1.finhay.com.vn/wp-content/uploads/2025/12/31150638/Google-Veo-3-1.jpg", desc: t.products.veo3, link: "veo3.html", priceOverride: t.priceOverrides.veo3 },
                { name: "Office 365", image: "https://support.microsoft.com/images/sk-sk/a800a3f9-f73c-46b0-9b08-774017436549", desc: t.products.office365, link: "office365.html", priceOverride: t.priceOverrides.office365 },
                { name: "Canva", image: "https://cdn.tgdd.vn/News/1558244/2-1280x720.jpg", desc: t.products.canva, link: "canva.html", priceOverride: t.priceOverrides.canva },
                { name: "YouTube Premium Cá Nhân", image: "https://cdn-media.sforum.vn/storage/app/media/wp-content/uploads/2024/02/thuc-te-chi-phi-youtube-premium-khong-giong-nhau-tren-moi-quoc-gia-12.jpg", desc: t.products.youtube, link: "youtube.html", priceOverride: t.priceOverrides.youtube }
            ];
        }

        // --- RENDER FUNCTION ---
        function render() {
            const t = translations[lang];
            const products = getProducts();
            const root = document.getElementById('root');

            // --- TRẠNG THÁI: SẢN PHẨM KHÔNG KHẢ DỤNG ---
            if (unavailableProduct) {
                root.innerHTML = `
                    <div class="min-h-screen bg-transparent text-slate-900 flex flex-col items-center justify-center p-4 font-sans dark:text-white transition-colors duration-300">
                        <div class="text-center max-w-md bg-white/90 dark:bg-gray-800/90 backdrop-blur-md p-10 rounded-3xl shadow-2xl border border-gray-200/50 dark:border-gray-700/50">
                            <i data-lucide="shield" class="w-20 h-20 text-blue-600 dark:text-blue-400 mx-auto mb-6"></i>
                            <h1 class="text-2xl md:text-3xl font-bold mb-3">${t.unavailable}</h1>
                            <p class="text-gray-500 dark:text-gray-400 mb-8 font-medium">(${unavailableProduct.name})</p>
                            <button onclick="goHome()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition-colors shadow-lg">
                                ${t.backHome}
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            // --- TRẠNG THÁI: TRANG CHỦ ---
            const headerLinksList = `
                <a href="https://2fa.legitshop.io.vn" target="_blank" rel="noreferrer" class="flex items-center gap-1.5 hover:text-blue-300 transition-colors font-medium">
                    <i data-lucide="shield" class="w-[18px] h-[18px]"></i> ${t.tool2fa}
                </a>
                <a href="https://zalo.me/g/kouxlv179" target="_blank" rel="noreferrer" class="flex items-center gap-1.5 hover:text-blue-300 transition-colors font-medium">
                    ${zaloSvg} ${t.zaloGroup}
                </a>
                <a href="https://zalo.me/0816522665" target="_blank" rel="noreferrer" class="flex items-center gap-1.5 hover:text-blue-300 transition-colors font-medium">
                    ${zaloSvg} ${t.zaloContact}
                </a>
                <a href="https://www.facebook.com/profile.php?id=61581503402796" target="_blank" rel="noreferrer" class="flex items-center gap-1.5 hover:text-blue-300 transition-colors font-medium">
                    <i data-lucide="facebook" class="w-[18px] h-[18px]"></i> ${t.fbContact}
                </a>
            `;

            const productsHtml = products.map((product, index) => {
                // Ưu tiên hiển thị giá riêng của từng gói nếu có (như youtube), nếu không lấy "Chỉ từ 70.000đ"
                const buttonText = product.priceOverride ? product.priceOverride : t.priceFrom;
                
                return `
                <a 
                    href="${product.link}" 
                    onclick="handleProductClick(event, '${product.link}', ${index})"
                    class="group bg-white dark:bg-gray-800/80 dark:backdrop-blur-sm rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 border border-gray-100 dark:border-gray-700/50 hover:border-blue-500 dark:hover:border-blue-400 relative overflow-hidden flex flex-col h-full"
                >
                    <div class="w-full h-48 overflow-hidden bg-gray-100 dark:bg-gray-700 relative">
                        <img 
                            src="${product.image}" 
                            alt="${product.name}" 
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                            onerror="this.onerror=null; this.src='https://placehold.co/600x400/f3f4f6/9ca3af?text=Image+Not+Found';"
                        />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </div>
                    
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="text-xl font-bold mb-3 text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
                            ${product.name}
                        </h3>
                        
                        <p class="text-gray-600 dark:text-gray-400 text-sm mb-6 flex-grow leading-relaxed">
                            ${product.desc}
                        </p>
                        
                        <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-700/50">
                            <span class="flex items-center justify-center w-full bg-blue-50 dark:bg-blue-900/30 group-hover:bg-blue-600 group-hover:text-white text-blue-700 dark:text-blue-400 font-bold py-3 px-4 rounded-xl transition-colors duration-300">
                                ${buttonText} <i data-lucide="chevron-right" class="w-[18px] h-[18px] ml-1"></i>
                            </span>
                        </div>
                    </div>
                </a>
                `
            }).join('');

            root.innerHTML = `
                <div class="min-h-screen text-slate-900 dark:text-white font-sans transition-colors duration-300 flex flex-col">
                    
                    <!-- Navigation -->
                    <nav class="sticky top-0 z-50 bg-blue-900 dark:bg-black/40 dark:backdrop-blur-xl text-white shadow-lg border-b border-blue-800/50 dark:border-white/10">
                        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="flex justify-between items-center h-20">
                                <!-- Logo -->
                                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer" onclick="window.scrollTo(0,0)">
                                    <img src="legit.png" alt="Legit Shop Logo" class="w-10 h-10 object-cover bg-white rounded-xl shadow-inner p-0.5" onerror="this.onerror=null; this.outerHTML='<i data-lucide=\\\'shield\\\' class=\\\'text-blue-400 w-8 h-8\\\'></i>'" />
                                    <span class="font-bold text-2xl tracking-tight">Legit Shop</span>
                                </div>

                                <!-- Desktop Menu -->
                                <div class="hidden lg:flex items-center space-x-8">
                                    ${headerLinksList}
                                </div>

                                <!-- Actions -->
                                <div class="hidden lg:flex items-center space-x-4">
                                    <button 
                                        onclick="toggleLang()"
                                        class="flex items-center gap-2 bg-blue-800 dark:bg-blue-900/50 hover:bg-blue-700 dark:hover:bg-blue-800 px-3 py-1.5 rounded-full transition-all border border-blue-700 dark:border-blue-700/50"
                                    >
                                        <span class="text-lg leading-none">${t.flag}</span>
                                        <span class="font-bold text-sm">${t.lang}</span>
                                    </button>
                                    <button 
                                        onclick="toggleTheme()"
                                        class="p-2 rounded-full bg-blue-800 dark:bg-blue-900/50 hover:bg-blue-700 dark:hover:bg-blue-800 transition-all border border-blue-700 dark:border-blue-700/50"
                                    >
                                        ${isDark ? '<i data-lucide="sun" class="w-5 h-5"></i>' : '<i data-lucide="moon" class="w-5 h-5"></i>'}
                                    </button>
                                </div>

                                <!-- Mobile menu button -->
                                <div class="lg:hidden flex items-center gap-4">
                                    <button onclick="toggleLang()" class="flex items-center gap-1 bg-blue-800 dark:bg-blue-900/50 px-2 py-1 rounded-full text-sm">
                                        <span>${t.flag}</span> ${t.lang}
                                    </button>
                                    <button onclick="toggleTheme()" class="p-1.5 bg-blue-800 dark:bg-blue-900/50 rounded-full">
                                        ${isDark ? '<i data-lucide="sun" class="w-[18px] h-[18px]"></i>' : '<i data-lucide="moon" class="w-[18px] h-[18px]"></i>'}
                                    </button>
                                    <button onclick="toggleMenu()" class="text-white hover:text-blue-300">
                                        ${isMenuOpen ? '<i data-lucide="x" class="w-7 h-7"></i>' : '<i data-lucide="menu" class="w-7 h-7"></i>'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Mobile Menu Panel -->
                        ${isMenuOpen ? `
                            <div class="lg:hidden bg-blue-950 dark:bg-blue-900/80 dark:backdrop-blur-xl px-4 pt-2 pb-4 space-y-3 border-t border-blue-800 dark:border-white/10">
                                <div class="flex flex-col space-y-4 pt-2">
                                    ${headerLinksList}
                                </div>
                            </div>
                        ` : ''}
                    </nav>

                    <!-- Hero Section -->
                    <div class="relative bg-blue-900 dark:bg-transparent overflow-hidden">
                        <!-- Decorative background elements -->
                        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
                            <div class="absolute -top-24 -right-24 w-96 h-96 bg-blue-500 rounded-full blur-3xl"></div>
                            <div class="absolute top-1/2 -left-24 w-72 h-72 bg-blue-400 rounded-full blur-3xl"></div>
                        </div>
                        
                        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-24 relative z-10 text-center">
                            <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 tracking-tight drop-shadow-lg">
                                ${t.heroTitle}
                            </h1>
                            <p class="text-xl md:text-2xl text-blue-100 dark:text-gray-300 max-w-3xl mx-auto mb-10 font-light">
                                ${t.heroSub}
                            </p>
                            <div class="flex flex-col sm:flex-row justify-center gap-4">
                                <a href="#products" class="bg-white text-blue-900 font-bold px-8 py-4 rounded-full shadow-xl hover:bg-gray-100 transition-all transform hover:-translate-y-1">
                                    ${t.productsTitle}
                                </a>
                                <a href="https://zalo.me/0816522665" target="_blank" rel="noreferrer" class="bg-blue-700 dark:bg-blue-800 text-white border border-blue-500 font-bold px-8 py-4 rounded-full shadow-lg hover:bg-blue-600 dark:hover:bg-blue-700 transition-all">
                                    ${t.zaloContact}
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Products Section -->
                    <div id="products" class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 py-20 flex-grow">
                        <div class="text-center mb-16">
                            <h2 class="text-3xl md:text-4xl font-extrabold text-blue-900 dark:text-blue-400 mb-4">
                                ${t.productsTitle}
                            </h2>
                            <div class="w-24 h-1.5 bg-blue-600 dark:bg-blue-500 mx-auto rounded-full"></div>
                        </div>

                        <!-- Lưới sản phẩm cập nhật: 5 cột trên màn hình xl -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-6 xl:gap-8">
                            ${productsHtml}
                        </div>
                    </div>

                    <!-- Footer -->
                    <footer class="mt-auto bg-blue-950 dark:bg-blue-950/40 dark:backdrop-blur-md text-blue-200 border-t border-blue-900/50 dark:border-white/10 pt-16 pb-8">
                        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-12">
                                <!-- Brand -->
                                <div>
                                    <div class="flex items-center gap-3 mb-6">
                                        <img src="legit.png" alt="Legit Shop Logo" class="w-10 h-10 object-cover bg-white rounded-xl shadow-sm p-0.5" onerror="this.onerror=null; this.outerHTML='<i data-lucide=\\\'shield\\\' class=\\\'text-blue-400 w-8 h-8\\\'></i>'" />
                                        <span class="font-bold text-2xl text-white tracking-tight">Legit Shop</span>
                                    </div>
                                    <p class="text-blue-300/80 leading-relaxed max-w-sm">
                                        ${t.footerDesc}
                                    </p>
                                </div>

                                <!-- Contact -->
                                <div>
                                    <h4 class="text-white font-bold text-lg mb-6">${t.contact}</h4>
                                    <ul class="space-y-4">
                                        <li class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full bg-blue-900/50 flex items-center justify-center text-blue-400">
                                                ${zaloSvg}
                                            </div>

        render();

        // --- HIỆU ỨNG MẠNG LƯỚI ĐỘNG (PARTICLE NETWORK) ---
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        
        const connectDistance = 150; 
        const mouseConnectDistance = 180; 
        
        let mouse = { x: null, y: null }
        
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });
        
        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 12000;
            if (numberOfParticles > 80) numberOfParticles = 80; 
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = Math.random() * 2 + 1;
                let x = Math.random() * (canvas.width - size * 2) + size * 2;
                let y = Math.random() * (canvas.height - size * 2) + size * 2;
                let directionX = (Math.random() - 0.5) * 1.5;
                let directionY = (Math.random() - 0.5) * 1.5;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }
        
        class Particle {
            constructor(x, y, directionX, directionY, size) {
                this.x = x; this.y = y; this.directionX = directionX; this.directionY = directionY; this.size = size;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = isDark ? 'rgba(96, 165, 250, 0.6)' : 'rgba(30, 64, 175, 0.4)'; 
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                this.x += this.directionX; this.y += this.directionY;
                this.draw();
            }
        }
        
        function animateNetwork() {
            requestAnimationFrame(animateNetwork);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) { particlesArray[i].update(); }
            connect();
        }
        
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) + 
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (connectDistance * connectDistance)) {
                        opacityValue = 1 - (distance / (connectDistance * connectDistance));
                        ctx.strokeStyle = isDark ? `rgba(96, 165, 250, ${opacityValue * 0.4})` : `rgba(30, 64, 175, ${opacityValue * 0.3})`;
                        ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
                if (mouse.x != null) {
                    let distanceToMouse = ((particlesArray[a].x - mouse.x) * (particlesArray[a].x - mouse.x)) + 
                                          ((particlesArray[a].y - mouse.y) * (particlesArray[a].y - mouse.y));
                    if (distanceToMouse < (mouseConnectDistance * mouseConnectDistance)) {
                        opacityValue = 1 - (distanceToMouse / (mouseConnectDistance * mouseConnectDistance));
                        ctx.strokeStyle = isDark ? `rgba(147, 197, 253, ${opacityValue * 0.7})` : `rgba(30, 58, 138, ${opacityValue * 0.5})`;
                        ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
                    }
                }
            }
        }
        
        window.addEventListener('resize', initCanvas);
        initCanvas(); animateNetwork();
    </script>
